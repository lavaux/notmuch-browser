[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notmuch-browser"
version = "0.1.0"
description = "A small local web UI to browse and tag a notmuch mail database"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilhem Lavaux" }]
keywords = ["notmuch", "email", "web", "maildir"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "nh3>=0.3.7,<0.4",
]

[project.scripts]
notmuch-browser = "notmuch_browser.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
]

[tool.hatch.build.hooks.custom]
# hatch_build.py refuses to build without the compiled webpack bundle.

[tool.hatch.build.targets.wheel]
packages = ["src/notmuch_browser"]
artifacts = ["src/notmuch_browser/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/web",
    "/tests",
    "/scripts",
    "/webpack.config.js",
    "/package.json",
    "/package-lock.json",
    "/pyproject.toml",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]
exclude = [".claude", ".impeccable"]
artifacts = ["src/notmuch_browser/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
